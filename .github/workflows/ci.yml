name: CI

on:
  push:
    branches: [master, staging]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Gio build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libx11-xcb-dev libwayland-dev libegl1-mesa-dev libxcursor-dev

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet -tags novulkan ./...

      - name: go build
        run: go build -tags novulkan ./...

      # Real cloudflared tunnels, real capture devices and browser interop are
      # verified by hand; CI runs the in-process seams only.
      - name: go test
        run: go test -tags novulkan -race ./...
